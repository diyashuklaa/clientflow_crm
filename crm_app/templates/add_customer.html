{% extends 'base.html' %}
{% block title %}Add Customer{% endblock %}
{% block page_title %}Add Customer{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-panel">
            <div class="panel-header mb-4">
                <h5>New Customer Details</h5>
                <a href="{{ url_for('customers.list_customers') }}" class="btn btn-sm btn-ghost">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>

            <form method="POST" action="{{ url_for('customers.add_customer') }}">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" placeholder="John Smith" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="john@example.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Deal Value (₹)</label>
                        <input type="number" name="deal_value" class="form-control" placeholder="50000" min="0" step="1000">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2" placeholder="Street, City, State"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Requirement / Notes</label>
                        <textarea name="requirement" class="form-control" rows="3" placeholder="What is the customer looking for?"></textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Lead Source</label>
                        <select name="lead_source" class="form-select">
                            <option value="">Select Source</option>
                            {% for src in lead_sources %}
                            <option value="{{ src }}">{{ src }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            {% for s in statuses %}
                            <option value="{{ s }}" {% if s == 'Interested' %}selected{% endif %}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% if current_user.role in ['admin', 'manager'] %}
                    <div class="col-md-4">
                        <label class="form-label">Assign To</label>
                        <select name="assigned_to" class="form-select">
                            <option value="">Select Staff</option>
                            {% for s in staff %}
                            <option value="{{ s.id }}" {% if s.id == current_user.id %}selected{% endif %}>{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}
                </div>

                <div class="d-flex gap-3 mt-4">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-plus-circle me-2"></i>Add Customer
                    </button>
                    <a href="{{ url_for('customers.list_customers') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
